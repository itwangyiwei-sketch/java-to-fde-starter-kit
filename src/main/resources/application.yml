server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: java-to-fde-starter-kit
  ai:
    mcp:
      server:
        name: java-to-fde-starter-kit
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC

fde:
  mcp:
    allowed-origins: ${FDE_MCP_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080}
  model:
    provider: ${FDE_MODEL_PROVIDER:mock}
    base-url: ${FDE_LLM_BASE_URL:https://api.openai.com/v1}
    model: ${FDE_LLM_MODEL:gpt-4.1-mini}
    api-key: ${FDE_LLM_API_KEY:}
    timeout-ms: ${FDE_LLM_TIMEOUT_MS:3000}
